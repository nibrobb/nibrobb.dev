name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Chart and deploy changes don't affect the image; skip the build for those
    paths-ignore:
      - "charts/**"
      - "deploy/**"
      - "**.md"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Pushes to main    -> main, sha-<short>   (staging and minikube track these)
          # Tags v1.2.3       -> 1.2.3, sha-<short>  (prod pins 1.2.3 via values-prod.yaml)
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public variables are inlined at build time; set them as repository variables
          build-args: |
            PUBLIC_GTAG_ID=${{ vars.PUBLIC_GTAG_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
