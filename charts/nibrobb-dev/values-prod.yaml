# Production: https://nibrobb.dev
image:
  # The ApplicationSet deploys git tag v<tag> for prod, so bump this with each release.
  # Git tag v0.1.0 publishes ghcr.io/nibrobb/nibrobb.dev:0.1.0.
  tag: "0.1.0"

env:
  - name: BASE_DOMAIN
    value: "https://nibrobb.dev"
  - name: SLACK_REDIRECT_URI
    value: "https://nibrobb.dev/oauth/slack/callback"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: nibrobb.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: nibrobb-dev-tls
      hosts:
        - nibrobb.dev

secrets:
  # Create this Secret out-of-band (kubectl, Sealed Secrets, External Secrets, ...)
  # with keys GITHUB_TOKEN, SLACK_CLIENT_ID, SLACK_CLIENT_SECRET
  existingSecret: nibrobb-dev-secrets
